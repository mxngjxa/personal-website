name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keyless auth: GitHub's OIDC token is exchanged for short-lived credentials
# of github-deploy@ via Workload Identity Federation (scripts/setup-ci-wif.sh).
permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned: an unpinned toolchain can change the build under us. Bump deliberately
      # (keep in step with ci.yml).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check ./src

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/162323591265/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@personal-website-74629.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: bunx firebase-tools@15.30.2 deploy --only hosting --project personal-website-74629 --non-interactive
