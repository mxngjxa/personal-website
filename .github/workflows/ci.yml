name: CI

# Pull-request check: the same lint + typecheck + build gate as firebase-deploy.yml,
# without deploying. No id-token permission; the WIF provider only trusts
# refs/heads/main anyway.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with firebase-deploy.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check ./src

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
